<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#d9eef1" />
    <meta
      name="description"
      content="Six gentle, playful learning worlds for little explorers ages 2–4."
    />
    <title>Sofi Learn · SofiArcade</title>
    <link rel="stylesheet" href="/garden.css?v=2" />
    <script src="/learn/content.js?v=1" defer></script>
    <script src="/learn/narration.js?v=1" defer></script>
    <script src="/learn/game.js?v=2" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <a class="brand" href="/">☀ Sofi<span>Arcade</span></a
        ><button class="pill" id="sound" aria-pressed="true">
          🔊 Sound on
        </button>
      </header>
      <div id="game"></div>
      <p class="audio-note" id="audio-note"></p>
      <details class="voice-settings">
        <summary>For grown-ups · Voice &amp; sound</summary>
        <p>
          Choose a voice and try it together. Available voices depend on this
          device.
        </p>
        <label for="voice-style">Speaking style</label>
        <select id="voice-style">
          <option value="playful">Playful explorer</option>
          <option value="gentle">Gentle storyteller</option>
        </select>
        <label for="voice-choice">Voice</label>
        <select id="voice-choice">
          <option value="">Automatic · best available</option>
        </select>
        <button class="pill" id="preview-voice">🔊 Hear voice</button>
      </details>
      <noscript
        ><p>
          Please enable JavaScript to play Sofi Learn.
          <a href="/">Return home</a>.
        </p></noscript
      >
      <footer>
        <span>Little discoveries. Big smiles.</span
        ><span>Made for Sofia ♡</span>
      </footer>
    </main>
  </body>
</html>
